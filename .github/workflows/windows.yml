name: Windows

on:
  push:
    branches: ["main"]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none


jobs:
  Build:
    if: github.repository_owner == 'myridia'
    runs-on: windows-latest
    steps:
     # - name: MSBuild
     #   uses: microsoft/setup-msbuild@v2
        
     # - name: Dependencies
     #   run: |
     #     choco install pkgconfiglite tree -y
     #     vcpkg install curl:x64-windows jansson:x64-windows dirent:x64-windows pthreads:x64-windows

          
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="x64-windows-static" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded"
          cmake --build build --config Release
          cp build\Release\launcher.exe 
        

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
           repo_token: ${{ secrets.GITHUB_TOKEN }}
           file: 'launcher.exe'
           tag: ${{ github.ref }}
           overwrite: true
           file_glob: true  
        


 
     
