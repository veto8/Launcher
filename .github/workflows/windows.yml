name: Windows

on:
  push:
    branches: ["main"]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none


jobs:
  Build:
    if: github.repository_owner == 'myridia'
    runs-on: windows-latest
    steps:
      #- name: MSBuild
      #  uses: microsoft/setup-msbuild@v2
        
      - name: Dependencies
        run: |
          pacman -S mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make
          # vcpkg install mingw 
          
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cp build\Release\launcher.exe 
        

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
           repo_token: ${{ secrets.GITHUB_TOKEN }}
           file: 'launcher.exe'
           tag: ${{ github.ref }}
           overwrite: true
           file_glob: true  
        


 
     
